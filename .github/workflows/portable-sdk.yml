name: SDK portable releases
on:
  workflow_dispatch:
  push:
    tags: ['sdk-v*']
    paths: ['tools/**', 'include/**', 'lib/**', 'contract/**', 'targets/**', 'toolchains/**', 'templates/**', 'docs/**', '.agents/**', 'README.md', 'tests/**', 'requirements*.txt', 'release.sh', '.github/workflows/portable-sdk.yml']
jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: build/portable-cache
          key: portable-deps-v1-${{ hashFiles('toolchains/catalog.json') }}
      - name: Validate operational documentation
        run: python tools/check_docs.py
      - name: Unit tests
        run: python -m unittest tests.test_docs tests.test_install_errors tests.test_release_identity tests.test_portable_release tests.test_cli tests.test_windows_tools tests.test_serial_shared -v
      - name: Package both hosts on Ubuntu
        env:
          TOOLCHAIN_URL: ${{ vars.ASTER_WINDOWS_TOOLCHAIN_URL }}
          TOOLCHAIN_SHA256: ${{ vars.ASTER_WINDOWS_TOOLCHAIN_SHA256 }}
        run: |
          test -n "$TOOLCHAIN_URL" && test -n "$TOOLCHAIN_SHA256" || { echo "Configure the immutable Windows compiler bundle URL and SHA256 repository variables (docs/release.md)."; exit 1; }
          bash release.sh --hosts linux-x64,windows-x64 --windows-toolchain-url "$TOOLCHAIN_URL" --windows-toolchain-sha256 "$TOOLCHAIN_SHA256"
      - name: Hash downloadable SDK archives
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('dist/portable')
          lines = []
          for path in sorted(root.iterdir()):
              if path.name.endswith(('.zip', '.tar.gz')):
                  line = hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
                  path.with_name(path.name + '.sha256').write_text(line)
                  lines.append(line)
          (root / 'SHA256SUMS.txt').write_text(''.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-portable
          path: dist/portable/*
          if-no-files-found: error
  windows-test:
    needs: package
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      # No checkout or packaging: validate the Ubuntu-produced ZIP only.
      - uses: actions/download-artifact@v4
        with:
          name: sdk-portable
          path: artifacts
      - shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts/*windows*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath extracted
          $sdk = Join-Path $PWD 'extracted/aster-sdk'
          & "$sdk/runtime/python.exe" "$sdk/tools/verify_windows_release.py" "$sdk"
          if ($LASTEXITCODE -ne 0) { throw 'Ubuntu-produced Windows SDK verification failed' }
  publish:
    needs: [package, windows-test]
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdk-portable
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Existing Release preserved; validated packages are available in the sdk-portable CI artifact."
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "Aster SDK ${GITHUB_REF_NAME#sdk-v}" --notes-file docs/使用说明.md
          fi
