name: Legacy Windows single-file tools (manual)
on:
  workflow_dispatch:
jobs:
  windows:
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned Windows toolchain
        uses: actions/cache@v4
        with:
          path: |
            build/windows-downloads/wasi-sdk-24.0-x86_64-windows.tar.gz
            build/windows-downloads/wasi-sdk
            build/windows-downloads/wamrc-xtensa
          key: windows-2022-toolchain-${{ hashFiles('tools/build_wamrc_windows.ps1', 'tools/package_windows.ps1') }}
      - name: Build SDK executables
        shell: pwsh
        run: ./tools/package_windows.ps1
      - name: Smoke test AOT and CLI
        shell: pwsh
        run: |
          python -m unittest tests.test_windows_tools tests.test_cli tests.test_release_identity tests.test_serial_shared -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows tool unit tests failed' }
          ./dist/windows/aster-toolchain.exe build apps/hello --target lckfb-s3 --aot
          if ($LASTEXITCODE -ne 0) { throw 'AOT build failed' }
          ./dist/windows/aster-toolchain.exe verify dist/lckfb-s3/aster.hello.ast --target lckfb-s3
          if ($LASTEXITCODE -ne 0) { throw 'package verification failed' }
          ./dist/windows/aster-toolchain.exe build apps/gfxshow --target lckfb-s3 --aot
          if ($LASTEXITCODE -ne 0) { throw 'gfxshow AOT build failed' }
          ./dist/windows/aster-toolchain.exe verify dist/lckfb-s3/aster.gfxshow.ast --target lckfb-s3
          if ($LASTEXITCODE -ne 0) { throw 'gfxshow package verification failed' }
          ./dist/windows/aster-device.exe build apps/hello --toolchain ./dist/windows/aster-toolchain.exe --target lckfb-s3
          if ($LASTEXITCODE -ne 0) { throw 'device build command failed' }
          ./dist/windows/aster-device.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'device CLI failed' }
      - name: Independent project with unified CLI
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'aster game'
          ./dist/windows/aster.exe init $project --template swipe-game --id test.cli.game
          if ($LASTEXITCODE -ne 0) { throw 'init failed' }
          ./dist/windows/aster.exe build $project
          if ($LASTEXITCODE -ne 0) { throw 'independent AOT build failed' }
          ./dist/windows/aster.exe verify "$project/dist/lckfb-s3/test.cli.game.ast"
          if ($LASTEXITCODE -ne 0) { throw 'package verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: aster-windows-tools
          path: |
            dist/windows/*
