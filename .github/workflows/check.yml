name: Standalone SDK
on: [push, pull_request]
jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_docs.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/aster.py build --all --target xtensa --aot
      - name: Independent template AOT build
        run: |
          python tools/aster.py init "$RUNNER_TEMP/aster-game" --template swipe-game --id test.cli.game
          python tools/aster.py build "$RUNNER_TEMP/aster-game"
          python tools/aster.py verify "$RUNNER_TEMP/aster-game/dist/xtensa/test.cli.game.ast"
      - name: Publish CPU-targeted example packages
        uses: actions/upload-artifact@v4
        with:
          name: sdk-xtensa-examples
          path: dist/xtensa/*.ast
          if-no-files-found: error
