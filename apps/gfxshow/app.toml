# ASTER app manifest — gfxshow: gfx-engine demo (ABI 3.0).
[app]
id      = "aster.gfxshow"
name    = "Gfx Show"
version = "0.1.0"
abi     = "3.0.0"
abi_min = "3.0"
optimize = "Os"
aot     = true
icon     = "icon.bin"      # palette.svg -> MJXI A8 (see ../assets/icons/README.md)
category = "game"
# See game.2048/app.toml: 256 KB is the canvas path's default, the 150 KB
# fallback framebuffer is what sets the floor.
initial_memory = 262144
stack   = 8192
requires = ["display", "touch"]
permissions = ["fs", "sd"]
sources = ["src/main.c"]
