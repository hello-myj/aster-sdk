[app]
description = "下一次转弯，交给你。"
id      = "aster.snake"
name    = "Snake"
version = "1.2.1"
abi      = "4.0.0"
abi_min  = "4.0"
optimize = "Os"
aot     = true
icon     = "icon.bin"
category = "game"
# See game.2048/app.toml: 256 KB is the canvas path's default, the 150 KB
# fallback framebuffer is what sets the floor.
initial_memory = 262144
stack   = 8192
requires = ["display", "touch"]
permissions = ["fs"]
assets = ["audio/eat.wav", "audio/death.wav", "audio/restart.wav", "audio/move.wav"]
sources = ["src/main.c"]
