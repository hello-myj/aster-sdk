[app]
description = "从光里，找回一段记忆。"
id      = "aster.gallery"
name    = "相册"
version = "1.0.1"
abi      = "4.0.0"
abi_min  = "4.0"
optimize = "Os"
aot     = true
icon     = "icon.bin"
category = "tool"
# A 320x480 RGB565 surface needs 307200 bytes, plus names and scratch.
# This also covers the smaller 240x320 LCKFB panel.
initial_memory = 524288
max_memory = 1048576
heap = 524288
stack   = 16384
requires = ["display", "touch", "filesystem"]
permissions = ["fs", "sd"]
sources = ["src/main.c"]
