[app]
id = "aster.ws.echo"
name = "WS Echo"
description = "通过 WebSocket 实际收发并校验回环内容，显示状态与计数。"
version = "1.0.0"
abi = "3.12.0"
abi_min = "3.12"
aot = true
stack = 16384
initial_memory = 262144
max_memory = 524288
heap = 65536
requires = ["websocket", "network"]
permissions = ["net"]
sources = ["src/main.c"]

[build]
# Simulator loopback. Hardware: replace with the peer's LAN hostname/IPv4.
# WSS additionally needs requires=["websocket","network","tls"] and a trusted root.
defines = ['WS_HOST="127.0.0.1"', 'WS_PORT=17880', 'WS_TLS=0']
